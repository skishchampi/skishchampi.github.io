<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {%- for t in site.data.talks %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "Event",
        "name": {{ t.title | jsonify }},
        "startDate": {{ t.start | jsonify }},
        {%- if t.end %}
        "endDate": {{ t.end | jsonify }},
        {%- endif %}
        {%- if t.url %}
        "url": {{ t.url | jsonify }},
        {%- endif %}
        "location": {
          "@type": "Place",
          "name": {{ t.venue | jsonify }}{% if t.address %},
          "address": {{ t.address | jsonify }}{% endif %}
        },
        "performer": {
          "@type": "Person",
          "name": "Aakash Solanki"
        }
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
